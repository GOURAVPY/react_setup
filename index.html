<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/macbook.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before the page paints, so dark mode does not flash light
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();

      // The startup screen only plays on the first load of a visit
      try {
        if (sessionStorage.getItem("booted")) {
          document.documentElement.classList.add("booted");
        }
      } catch (e) {}
    </script>
    <style>
      /* Startup screen. Styled here so it shows before the app's CSS loads. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4.5rem;
        background: #000;
        transition: opacity 0.6s ease;
      }
      #boot .boot-power,
      #boot .boot-loading {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: opacity 0.5s ease;
      }
      #boot .boot-power {
        gap: 1.5rem;
        color: #a3a3a3;
        font: 500 0.95rem/1 system-ui, sans-serif;
        letter-spacing: 0.02em;
      }
      #boot .boot-power button {
        display: grid;
        place-items: center;
        width: 84px;
        height: 84px;
        border: 2px solid #525252;
        border-radius: 50%;
        background: transparent;
        color: #fff;
        cursor: pointer;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s;
      }
      #boot .boot-power button:hover,
      #boot .boot-power button:focus-visible {
        border-color: #fff;
        box-shadow: 0 0 28px rgb(255 255 255 / 0.35);
        outline: none;
      }
      #boot .boot-power button:active {
        transform: scale(0.94);
      }
      #boot .boot-loading {
        gap: 4.5rem;
        opacity: 0;
        pointer-events: none;
      }
      #boot.starting .boot-power {
        opacity: 0;
        pointer-events: none;
      }
      #boot.starting .boot-loading {
        opacity: 1;
        transition-delay: 0.4s;
      }
      #boot img {
        width: 84px;
        filter: invert(1);
      }
      #boot .boot-bar {
        width: 200px;
        height: 5px;
        border-radius: 99px;
        background: #3a3a3a;
        overflow: hidden;
      }
      #boot .boot-bar span {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 99px;
        background: #fff;
        transition: width 0.25s linear;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      html.booted #boot {
        display: none;
      }
    </style>
    <title>Gourav's portfolio</title>
  </head>
  <body>
    <div id="boot">
      <div class="boot-power">
        <button type="button" aria-label="Power on">
          <svg
            width="34"
            height="34"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M12 3v9" />
            <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
          </svg>
        </button>
        <p>Want to power on?</p>
      </div>
      <div class="boot-loading" role="status" aria-label="Starting up">
        <img src="/images/logo.svg" alt="" />
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
