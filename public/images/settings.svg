<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bcc4"/>
      <stop offset="1" stop-color="#6d7079"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4e57"/>
      <stop offset="1" stop-color="#23252b"/>
    </linearGradient>
  </defs>
  <rect x="11" y="11" width="98" height="98" rx="23" fill="url(#plate)"/>
  <rect x="11.75" y="11.75" width="96.5" height="96.5" rx="22.25" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
  <g transform="translate(60 60)">
    <!-- twelve teeth: a dashed ring, one dash per tooth -->
    <circle r="31" fill="none" stroke="url(#gear)" stroke-width="10" stroke-dasharray="8.12 8.11" transform="rotate(-7.5)"/>
    <circle r="24" fill="none" stroke="url(#gear)" stroke-width="9"/>
    <g stroke="url(#gear)" stroke-width="5" stroke-linecap="round">
      <path d="M0-7v-13"/>
      <path d="M0-7v-13" transform="rotate(120)"/>
      <path d="M0-7v-13" transform="rotate(240)"/>
    </g>
    <circle r="8" fill="url(#gear)"/>
    <circle r="3" fill="#b9bcc4"/>
  </g>
</svg>
