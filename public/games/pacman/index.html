<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACMAN</title>
    <link rel="stylesheet" href="sly.css">
</head>
<body>
    <canvas class="canvas" width="420" height="540"></canvas>
    <div class="controls">
        <button data-key="Escape">II</button>
        <button data-key="ArrowUp">&#9650;</button>
        <button data-key="Enter">OK</button>
        <button data-key="ArrowLeft">&#9664;</button>
        <button data-key="ArrowDown">&#9660;</button>
        <button data-key="ArrowRight">&#9654;</button>
    </div>
    <div class="canvaimg">
        <img class="animationes" src="aessta/animations.gif" alt="" srcset="">
        <img class="fruits" src="aessta/fruits.png" alt="" srcset="">
        <img class="arcade" src="aessta/arcadesprites.png" alt="" srcset="">
        <img class="font" src="aessta/arcadefont.png" alt="" srcset="">
    </div>
</body>
<script src="sound.js"></script>
<script src="font.js"></script>
<script src="mazes.js"></script>
<script src="scores.js"></script>
<script src="powerups.js"></script>
<script src="cutscene.js"></script>
<script src="ghost.js"></script>
<script src="PACMAN.js"></script>
<script src="game.js"></script>
<script src="menu.js"></script>
<script src="touch.js"></script>
<script src="portfolio-bridge.js"></script>
</html>
